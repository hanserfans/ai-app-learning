name: Check learning examples

on: [push, pull_request]

permissions:
  contents: read

jobs:
  examples:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline example checks
        run: python tools/check_examples.py
